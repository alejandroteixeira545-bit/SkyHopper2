name: Build Sky Hopper 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Entrar no projeto Android
        run: |
          cd android-project/SkyHopper2Android

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar AAB
        working-directory: android-project/SkyHopper2Android
        run: gradle bundleRelease

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: SkyHopper2-AAB
          path: android-project/SkyHopper2Android/app/build/outputs/bundle/release/*.aab
