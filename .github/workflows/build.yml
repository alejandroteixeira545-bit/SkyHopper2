name: Build Sky Hopper 2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        run: |
          unzip -o "SkyHopper2_Android_PlayReady (2).zip" -d android-project

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gerar APK
        working-directory: android-project/SkyHopper2Android
        run: gradle assembleRelease

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyHopper2-APK
          path: android-project/SkyHopper2Android/app/build/outputs/apk/release/*.apk
