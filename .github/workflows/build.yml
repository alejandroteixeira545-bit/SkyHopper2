name: Build Sky Hopper 2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        run: |
          unzip -o "SkyHopper2_Android_PlayReady (2).zip" -d android-project

      - name: Corrigir toque na loja
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivos = list(Path("android-project").rglob("sky_hopper_2.html"))

          if not arquivos:
              raise SystemExit("HTML do jogo não encontrado")

          antigo = "addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;flap()});"

          novo = """addEventListener('pointerdown',e=>{
            if(!$('shop').classList.contains('hidden'))return;
            if(e.target.closest('button'))return;
            flap();
          });"""

          for arquivo in arquivos:
              texto = arquivo.read_text(encoding="utf-8")

              if antigo not in texto:
                  raise SystemExit("Trecho do toque não encontrado")

              texto = texto.replace(antigo, novo)
              arquivo.write_text(texto, encoding="utf-8")
              print("Correção aplicada:", arquivo)
          PY

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Gerar APK
        working-directory: android-project/SkyHopper2Android
        run: gradle assembleRelease

      - name: Assinar APK
        working-directory: android-project/SkyHopper2Android
        run: |
          keytool -genkeypair -v \
            -keystore skyhopper.keystore \
            -alias skyhopper \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass skyhopper123 \
            -keypass skyhopper123 \
            -dname "CN=Sky Hopper 2, OU=Games, O=Alejantv, L=Brazil, ST=CE, C=BR"

          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner sign \
            --ks skyhopper.keystore \
            --ks-pass pass:skyhopper123 \
            --key-pass pass:skyhopper123 \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: SkyHopper2-APK
          path: android-project/SkyHopper2Android/app/build/outputs/apk/release/app-release.apk
