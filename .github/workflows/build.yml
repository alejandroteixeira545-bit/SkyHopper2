name: Build Sky Hopper 2

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extrair projeto Android
        run: |
          mkdir -p android-project
          unzip -o *.zip -d android-project
          echo "Arquivos encontrados:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Encontrar projeto Gradle
        run: |
          PROJECT_DIR=$(find android-project -name gradlew -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permissão ao Gradle
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Gerar AAB
        run: |
          cd "$PROJECT_DIR"
          ./gradlew bundleRelease

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: SkyHopper2-AAB
          path: |
            android-project/**/build/outputs/bundle/release/*.aab
