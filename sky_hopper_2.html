<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Hopper 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06152b;font-family:system-ui,-apple-system,Segoe UI,Arial}
body{display:grid;place-items:center}.app{position:relative;width:min(100vw,480px);height:min(100vh,850px);overflow:hidden;background:#071b35;box-shadow:0 0 50px #0008}
canvas{width:100%;height:100%;display:block}.screen{position:absolute;inset:0;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#082552aa,#061126dd);backdrop-filter:blur(3px);color:white}.hidden{display:none!important}
.logo{font-size:48px;font-weight:1000;letter-spacing:2px;text-shadow:0 5px 0 #15466c,0 12px 28px #0008;text-align:center}.subtitle{opacity:.8;margin:2px 0 25px}.birdLogo{font-size:76px;filter:drop-shadow(0 12px 10px #0006);animation:bob 1.3s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-10px) rotate(4deg)}}
.btn{width:min(330px,90%);border:0;border-radius:18px;padding:16px;margin:7px;font-size:18px;font-weight:900;color:#06233d;background:linear-gradient(#ffe96a,#ffc52e);box-shadow:0 6px 0 #a9710c;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a9710c}.btn.secondary{color:white;background:#183d68;box-shadow:0 6px 0 #0a2442}
.top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:4;color:white;font-weight:900;text-shadow:0 3px 5px #0007}.pill{background:#071b35aa;border:1px solid #ffffff25;padding:8px 12px;border-radius:14px}
.score{position:absolute;top:52px;left:0;width:100%;text-align:center;font-size:42px;font-weight:1000;color:#fff;text-shadow:0 4px 0 #17628b;z-index:3}
.shop{width:min(410px,100%);background:#0b2445ee;border:1px solid #ffffff22;border-radius:25px;padding:18px;box-shadow:0 20px 60px #0008}.shop h2{text-align:center;margin:0 0 8px}.coins{text-align:center;font-weight:900;margin-bottom:14px}.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:390px;overflow:auto}.skin{background:#12365d;border:2px solid transparent;border-radius:18px;padding:13px;text-align:center}.skin.selected{border-color:#ffd83e}.skin .icon{font-size:46px}.skin b{display:block;margin:4px}.buy{border:0;border-radius:10px;padding:8px 13px;font-weight:900;background:#ffd83e}.buy:disabled{opacity:.5}
.info{font-size:13px;opacity:.7;text-align:center;margin-top:12px}
.gameover h2{font-size:40px;margin:0}.result{font-size:58px;font-weight:1000;margin:5px}
</style>
</head>
<body>
<div class="app">
<canvas id="c"></canvas>
<div id="menu" class="screen">
  <div class="birdLogo" id="logoBird">🐦</div>
  <div class="logo">SKY HOPPER</div><div class="subtitle">EDITION 2 • FLIGHT &amp; FURY</div>
  <button class="btn" id="play">▶ JOGAR</button>
  <button class="btn secondary" id="shopBtn">🛍️ LOJA DE SKINS</button>
  <div class="info">Toque na tela ou pressione ESPAÇO para voar</div>
</div>
<div id="shop" class="screen hidden">
  <div class="shop"><h2>🛍️ LOJA</h2><div class="coins">🪙 <span id="coins">0</span> moedas</div><div id="skins" class="skins"></div><button class="btn secondary" id="back">← VOLTAR</button></div>
</div>
<div id="over" class="screen hidden">
  <div class="birdLogo" id="overBird">🐦</div><h2>FIM DE VOO</h2><div class="result" id="final">0</div><div>pontos</div><p>🪙 <b id="earned">0</b> moedas coletadas</p>
  <button class="btn" id="again">↻ JOGAR NOVAMENTE</button><button class="btn secondary" id="home">⌂ MENU</button>
</div>
<div id="hud" class="top hidden"><span class="pill">🏆 <span id="best">0</span></span><span class="pill">🪙 <span id="runCoins">0</span></span></div>
<div id="score" class="score hidden">0</div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d'),W=480,H=850;C.width=W*2;C.height=H*2;ctx.scale(2,2);
const $=id=>document.getElementById(id);
const skins=[
 {id:'classic',name:'Aventureiro',icon:'🐦',cost:0,body:'#ffd33d',wing:'#f0a31b'},
 {id:'ruby',name:'Rubi',icon:'🐤',cost:40,body:'#ff4f68',wing:'#bd1838'},
 {id:'aqua',name:'Aqua',icon:'🦜',cost:80,body:'#45e0e0',wing:'#0b91aa'},
 {id:'gold',name:'Dourado',icon:'🦚',cost:140,body:'#ffe45c',wing:'#e89b18'},
 {id:'shadow',name:'Sombra',icon:'🐧',cost:220,body:'#9b9bff',wing:'#3e3e78'},
 {id:'royal',name:'Royal',icon:'🦉',cost:350,body:'#c6a4ff',wing:'#6336a5'}
];
let data=JSON.parse(localStorage.skyHopper2||'{"coins":0,"best":0,"owned":["classic"],"skin":"classic"}');
function save(){localStorage.skyHopper2=JSON.stringify(data)}
let audio=null;
function sound(type){
 try{audio ||= new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume();
 let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);
 let f=type==='coin'?880:type==='hit'?120:type==='score'?660:420;o.frequency.value=f;o.type=type==='hit'?'sawtooth':'sine';g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.start();o.stop(audio.currentTime+.12)
 }catch(e){}
}
function renderShop(){
 $('coins').textContent=data.coins;$('skins').innerHTML=skins.map(s=>{
 let owned=data.owned.includes(s.id),sel=data.skin===s.id;
 return `<div class="skin ${sel?'selected':''}"><div class="icon">${s.icon}</div><b>${s.name}</b><small>${owned?(sel?'Selecionada':'Disponível'):'🪙 '+s.cost}</small><br><button class="buy" ${owned?'':(data.coins<s.cost?'disabled':'')}>${sel?'✓':owned?'USAR':'COMPRAR'}</button></div>`
 }).join('');
 [...$('skins').children].forEach((el,i)=>el.querySelector('button').onclick=()=>{
 let s=skins[i];if(data.owned.includes(s.id)){data.skin=s.id}else if(data.coins>=s.cost){data.coins-=s.cost;data.owned.push(s.id);data.skin=s.id;sound('coin')}save();renderShop();updateLogo()
 })
}
function updateLogo(){let s=skins.find(x=>x.id===data.skin)||skins[0];$('logoBird').textContent=s.icon;$('overBird').textContent=s.icon}
renderShop();updateLogo();

let running=false,last=0,time=0,bird,pipes,coins,particles,score,runCoins,speed,gap,spawnTimer;
function reset(){bird={x:112,y:405,vy:0,r:18,rot:0};pipes=[];coins=[];particles=[];score=0;runCoins=0;speed=190;gap=190;spawnTimer=.2;$('score').textContent=0;$('runCoins').textContent=0}
function start(){['menu','shop','over'].forEach(x=>$(x).classList.add('hidden'));$('hud').classList.remove('hidden');$('score').classList.remove('hidden');reset();running=true;last=performance.now();requestAnimationFrame(loop)}
$('play').onclick=start;$('again').onclick=start;$('shopBtn').onclick=()=>{$('menu').classList.add('hidden');$('shop').classList.remove('hidden');renderShop()};$('back').onclick=()=>{$('shop').classList.add('hidden');$('menu').classList.remove('hidden');updateLogo()};
$('home').onclick=()=>{$('over').classList.add('hidden');$('hud').classList.add('hidden');$('score').classList.add('hidden');$('menu').classList.remove('hidden');updateLogo()};
function flap(){if(running){bird.vy=-415;burst(bird.x-12,bird.y+5,'#fff',5);sound('flap')}else start()}
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});

function spawn(){
 let top=105+Math.random()*(H-355);pipes.push({x:W+30,top,gap,passed:false});
 if(Math.random()<.72)coins.push({x:W+110,y:top+gap/2,r:11,taken:false});
}
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,life:.5+Math.random()*.35,color,size:2+Math.random()*4})}
function hitCircleRect(cx,cy,r,rx,ry,rw,rh){let x=Math.max(rx,Math.min(cx,rx+rw)),y=Math.max(ry,Math.min(cy,ry+rh));return (cx-x)**2+(cy-y)**2<r*r}
function die(){if(!running)return;running=false;sound('hit');burst(bird.x,bird.y,'#ffd84a',24);data.coins+=runCoins;data.best=Math.max(data.best,score);save();$('best').textContent=data.best;$('final').textContent=score;$('earned').textContent=runCoins;$('over').classList.remove('hidden');$('hud').classList.add('hidden');$('score').classList.add('hidden')}
function update(dt){
 time+=dt;speed=Math.min(310,190+score*3.2);gap=Math.max(128,190-score*1.3);bird.vy+=1080*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.55,Math.min(1.1,bird.vy/500));
 spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.85,1.38- score*.008)}
 for(let p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+72<bird.x){p.passed=true;score++;$('score').textContent=score;sound('score');burst(bird.x,bird.y,'#fff',7)}
 if(hitCircleRect(bird.x,bird.y,bird.r,p.x,0,72,p.top)||hitCircleRect(bird.x,bird.y,bird.r,p.x,p.top+gap,72,H))return die()}
 for(let c of coins){c.x-=speed*dt;c.taken ||= Math.hypot(bird.x-c.x,bird.y-c.y)<27;if(c.taken&&c.x>0){runCoins++;c.x=-999;$('runCoins').textContent=runCoins;sound('coin');burst(bird.x,bird.y,'#ffe34d',14)}}
 pipes=pipes.filter(p=>p.x>-100);coins=coins.filter(c=>c.x>-50&&!c.taken);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
 if(bird.y-bird.r<0||bird.y+bird.r>H-65)die()
}
function cloud(x,y,s){ctx.save();ctx.globalAlpha=.4;ctx.fillStyle='#fff';[[-20,4,24],[10,-8,31],[40,4,22]].forEach(a=>{ctx.beginPath();ctx.arc(x+a[0]*s,y+a[1]*s,a[2]*s,0,7);ctx.fill()});ctx.restore()}
function pipe(x,y,w,h,top){let g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'#075f3a');g.addColorStop(.45,'#4ee076');g.addColorStop(1,'#0a7a45');ctx.fillStyle=g;let cap=25;if(top){ctx.fillRect(x,y,w,h-cap);ctx.fillRect(x-7,h-cap,w+14,cap)}else{ctx.fillRect(x,y,w,h-cap);ctx.fillRect(x-7,y,w+14,cap)}ctx.strokeStyle='#06452f';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h-cap)}
function draw(){
 let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#39bfff');sky.addColorStop(.65,'#a9edff');sky.addColorStop(1,'#eaf5c8');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 cloud(80-(time*12%560),120,1);cloud(390-(time*8%600),235,.7);cloud(180-(time*6%520),310,.55);
 ctx.fillStyle='#74c789';ctx.beginPath();ctx.moveTo(0,H-105);for(let x=0;x<=W;x+=30)ctx.lineTo(x,H-105-Math.sin(x*.018+time*.22)*23);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 pipes.forEach(p=>{pipe(p.x,0,72,p.top,true);pipe(p.x,p.top+gap,72,H-(p.top+gap)+20,false)});
 for(let c of coins){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(time*4);ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(0,0,c.r,0,7);ctx.fill();ctx.fillStyle='#fff3a1';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('★',0,5);ctx.restore()}
 ctx.fillStyle='#d9ea91';ctx.fillRect(0,H-65,W,65);ctx.fillStyle='#76bd55';ctx.fillRect(0,H-65,W,9);
 for(let x=-(time*speed%38);x<W;x+=38){ctx.fillStyle='#5da545';ctx.fillRect(x,H-50,21,4)}
 let s=skins.find(x=>x.id===data.skin)||skins[0];ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.shadowColor='#0005';ctx.shadowBlur=13;ctx.fillStyle=s.body;ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=s.wing;ctx.beginPath();ctx.ellipse(-7,8,12,7,Math.sin(time*12)*.18,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-7,7,0,7);ctx.fill();ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(11,-7,3,0,7);ctx.fill();ctx.fillStyle='#ff7b25';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(31,5);ctx.lineTo(17,9);ctx.fill();ctx.restore();
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)});ctx.globalAlpha=1;
}
function loop(now){if(!running)return;let dt=Math.min(.025,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
$('best').textContent=data.best;
draw();
</script>
</body>
</html>
